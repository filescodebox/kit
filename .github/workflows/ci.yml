name: CI
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: go.sum
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./...

      # 依赖漏洞门禁（govulncheck）：可达漏洞即红；修复策略=升依赖地板，不许注释绕过
      - name: Govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      # lint 棘轮（.golangci.yml 从 0 issues 起步，只收紧不放宽）
      - name: Lint (golangci-lint)
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14
          args: --timeout 9m
      - name: Dep guard(kit 为生态叶子仓,禁依赖任何兄弟模块)
        run: |
          BAD=$(go list -deps ./... | grep -E '^github\.com/pigeonbox/' | grep -Ev '^github\.com/pigeonbox/kit(/|$)' || true)
          if [ -n "$BAD" ]; then echo "✗ kit 违规依赖:"; echo "$BAD"; exit 1; fi
          echo "✓ 依赖方向合规"
